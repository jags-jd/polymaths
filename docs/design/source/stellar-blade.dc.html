<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stellar Blade checklist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0;background:#0F1117}
a{color:#ECEEF4}a:hover{color:#FFFFFF}
input[type="checkbox"]{cursor:pointer}
button{cursor:pointer;font-family:inherit}
input::placeholder{color:#A3A9B8}
</style>
</helmet>
<div style="background: #0F1117; color: #ECEEF4; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; padding-bottom: 72px">

<header style="border-bottom: 1px solid #2A2F3D; background: #12141C">
<div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; min-height: 44px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="22" height="22" rx="6"></rect><path d="M9 14.5l3.5 3.5L19.5 10.5"></path></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">Polymaths</span>
</a>
<div style="flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 10px; background: #181B24; border: 1px solid #2A2F3D; border-radius: 10px; padding: 0 14px; min-height: 44px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A9B8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="game-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search games</label>
<input id="game-search" type="search" placeholder="Search games" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #ECEEF4; font: inherit; height: 42px">
</div>
<a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; min-height: 44px">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #2A2F3D; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">IG</span>
<span style="font-weight: 500">[YOUR IGN]</span>
</a>
</div>
</header>

<main id="top" style="max-width: 1120px; margin: 0 auto; padding: 0 24px">

<section style="padding: 40px 0 32px; display: flex; flex-direction: column; gap: 24px">
<div style="background: #181B24; border: 1px solid #2A2F3D; border-radius: 20px; padding: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
<div style="position: relative; width: 148px; height: 148px; flex: none">
<svg role="img" aria-label="Overall progress ring" width="148" height="148" viewBox="0 0 148 148">
<circle cx="74" cy="74" r="62" fill="none" stroke="#2A2F3D" stroke-width="14"></circle>
<circle cx="74" cy="74" r="62" fill="none" stroke="{{accent}}" stroke-width="14" stroke-linecap="round" transform="rotate(-90 74 74)" style="stroke-dasharray: {{ringDash}}"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px; line-height: 1">{{percent}}%</span>
<span style="font-size: 12px; color: #A3A9B8">complete</span>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A9B8">Game checklist</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.02; letter-spacing: -0.02em">Stellar Blade</h1>
<span style="font-size: 17px; font-weight: 500">{{doneCount}} of {{totalCount}} done. {{leftCount}} to go.</span>
<span style="font-size: 13px; color: #A3A9B8">Cards light up as you finish them. Spoilers stay blurred until you tap them.</span>
</div>
</div>
<nav aria-label="Categories" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{categories}}" as="cat" hint-placeholder-count="4">
<a href="#{{cat.anchor}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; background: #181B24; border: 1px solid #2A2F3D; text-decoration: none; font-size: 14px; font-weight: 500">
<span>{{cat.short}}</span>
<span style="color: {{accent}}; font-weight: 600">{{cat.done}}/{{cat.total}}</span>
</a>
</sc-for>
</nav>
</section>

<div style="display: flex; flex-direction: column; gap: 44px">
<sc-for list="{{categories}}" as="cat" hint-placeholder-count="3">
<section id="{{cat.anchor}}" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-bottom: 12px; border-bottom: 1px solid #2A2F3D">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em">{{cat.name}}</h2>
<div style="display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 96px; height: 6px; border-radius: 999px; background: #2A2F3D; overflow: hidden">
<div style="height: 100%; background: {{accent}}; width: {{cat.pct}}%"></div>
</div>
<span style="font-size: 14px; font-weight: 500; color: #A3A9B8">{{cat.done}} / {{cat.total}}</span>
</div>
</div>

<sc-if value="{{cat.isGallery}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px">
<sc-for list="{{cat.items}}" as="item" hint-placeholder-count="6">
<button type="button" aria-pressed="{{item.done}}" aria-label="{{item.aria}}" onClick="{{item.act}}" style="display: flex; flex-direction: column; padding: 0; margin: 0; text-align: left; background: {{item.bg}}; border: 2px solid {{item.border}}; border-radius: 14px; overflow: hidden; color: #ECEEF4; font-size: 15px">
<span style="position: relative; display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: {{cat.ratio}}; background: {{item.tile}}">
<sc-if value="{{item.shown}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 52px; letter-spacing: -0.02em; color: rgba(255,255,255,0.26)">{{item.mono}}</span>
<span style="position: absolute; left: 8px; bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #D5DAE4">Image slot</span>
</sc-if>
<sc-if value="{{item.masked}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #D5DAE4; font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
Spoiler
</span>
</sc-if>
<sc-if value="{{item.done}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: {{accent}}; color: #0F1117; font-size: 11px; font-weight: 600">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
{{cat.doneWord}}
</span>
</sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 12px; min-height: 62px; box-sizing: border-box">
<sc-if value="{{item.shown}}" hint-placeholder-val="{{ true }}">
<span style="font-weight: 600; line-height: 1.25">{{item.name}}</span>
<sc-if value="{{item.desc}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; line-height: 1.35; color: #A3A9B8">{{item.desc}}</span>
</sc-if>
</sc-if>
<sc-if value="{{item.masked}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="font-weight: 600; filter: blur(6px); user-select: none; white-space: nowrap; overflow: hidden">{{item.name}}</span>
<span style="font-size: 12px; color: #A3A9B8">Tap to reveal</span>
</sc-if>
</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{cat.isList}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px">
<sc-for list="{{cat.items}}" as="item" hint-placeholder-count="3">
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; min-height: 52px; box-sizing: border-box; background: {{item.bg}}; border: 1px solid {{item.border}}; border-radius: 12px">
<input id="{{item.id}}" type="checkbox" checked="{{item.done}}" onChange="{{item.toggle}}" aria-label="{{item.aria}}" style="width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: {{accent}}">
<sc-if value="{{item.shown}}" hint-placeholder-val="{{ true }}">
<label for="{{item.id}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; cursor: pointer; padding: 2px 0">
<span style="font-weight: 500; color: {{item.color}}">{{item.name}}</span>
<sc-if value="{{item.desc}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; color: #A3A9B8">{{item.desc}}</span>
</sc-if>
</label>
</sc-if>
<sc-if value="{{item.masked}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{item.reveal}}" aria-label="Reveal spoiler" style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: transparent; border: 0; padding: 2px 0; margin: 0; color: #ECEEF4; text-align: left; font-size: 15px; min-height: 26px">
<span aria-hidden="true" style="filter: blur(6px); font-weight: 500; user-select: none; overflow: hidden; white-space: nowrap">{{item.name}}</span>
<span style="flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #ECEEF4; background: #2A2F3D; border-radius: 999px; padding: 4px 10px">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
Spoiler
</span>
</button>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>
</section>
</sc-for>
</div>

</main>
</div>
</x-dc>

renderVals() {
var self = this;
var st = this.state || { done: {}, revealed: {} };
var tiles = ['#2B3A55', '#3A2F52', '#274640', '#4A3530', '#44402A', '#452F3F'];
var total = 0, doneAll = 0;
var categories = this.data().map(function (c) {
var doneInCat = 0;
var gallery = c.kind === 'gallery';
var items = c.items.map(function (it, i) {
var id = it[0];
var name = it[1];
var isDone = !!st.done[id];
var masked = it[2] && !st.revealed[id] && !isDone;
if (isDone) doneInCat++;
var toggle = function () {
var d = Object.assign({}, self.state.done);
if (d[id]) { delete d[id]; } else { d[id] = true; }
self.setState({ done: d });
};
var reveal = function () {
var r = Object.assign({}, self.state.revealed);
r[id] = true;
self.setState({ revealed: r });
};
var mono = name.split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join('').toUpperCase();
return {
id: id,
name: name,
desc: it[3] || '',
mono: mono,
done: isDone,
masked: masked,
shown: !masked,
aria: masked ? (gallery ? 'Reveal spoiler' : 'Mark hidden spoiler item as done') : name,
tile: masked ? '#20232E' : tiles[i % tiles.length],
bg: isDone ? '#1B2420' : '#181B24',
border: isDone ? (gallery ? (self.props.accent ?? '#7CE0C3') : '#3D5A50') : '#2A2F3D',
color: isDone ? '#C9D0DC' : '#ECEEF4',
toggle: toggle,
reveal: reveal,
act: masked ? reveal : toggle
};
});
total += items.length;
doneAll += doneInCat;
return {
anchor: 'cat-' + c.id,
name: c.name,
short: c.short,
isGallery: gallery,
isList: !gallery,
ratio: c.ratio || '4 / 3',
doneWord: c.doneWord || 'Done',
items: items,
total: items.length,
done: doneInCat,
pct: Math.round((doneInCat / items.length) * 100)
};
});
var pct = Math.round((doneAll / total) * 100);
var circ = 2 * Math.PI * 62;
return {
accent: this.props.accent ?? '#7CE0C3',
categories: categories,
totalCount: total,
doneCount: doneAll,
leftCount: total - doneAll,
percent: pct,
ringDash: ((doneAll / total) * circ).toFixed(1) + ' ' + circ.toFixed(1)
};
}
}
</script>
</body>
</html>
